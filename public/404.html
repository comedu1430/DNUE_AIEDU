<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var repoBase = "/DNUE_AIEDU";
        var route = window.location.pathname.startsWith(repoBase)
          ? window.location.pathname.slice(repoBase.length)
          : window.location.pathname;
        var target = repoBase + "/?p=" + encodeURIComponent((route || "/") + window.location.search + window.location.hash);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
  </html>
